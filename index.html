<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi Ki Doğdun!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="login-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;">
        <h2>Bu Özel Bir Sürprizdir 🎂</h2>
        <p>Lütfen devam etmek için şifreyi girin:</p>
        <input type="password" id="password-input" style="padding: 10px; margin: 10px; border-radius: 5px; border: none;">
        <button onclick="checkPassword()" style="padding: 10px 20px; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 5px;">Giriş Yap</button>
        <p id="error-msg" style="color: red; display: none;">Hatalı şifre!</p>
    </div>

    <div id="main-content" style="display: none;">
        <div id="background-slider"></div>
        <div class="content">
            <h1>Doğum günün kutlu olsun<br>nice senelere</h1>
        </div>
        <audio id="bg-music" loop>
          <source src="dogumgunu.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script src="script.js"></script>
</body>

</html>
